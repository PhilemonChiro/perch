name: build

on:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: "6.9.3"
  QTKEYCHAIN_REF: "0.15.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
          - os: macos-14
            name: macos
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      # --- FreeRDP 3 ---
      - name: FreeRDP (macOS)
        if: runner.os == 'macOS'
        # The runner image ships a pinned local homebrew/core tap (FreeRDP
        # 3.31.0), which `brew install` prefers over the API. Untap it so the
        # install resolves from Homebrew's API (currently 3.32.2, >= the
        # SECURITY.md floor) without a slow/hanging `brew update`.
        run: |
          brew untap --force homebrew/core homebrew/cask || true
          brew install freerdp ninja

      - name: FreeRDP (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build freerdp3-dev libsecret-1-dev libgl1-mesa-dev libxkbcommon-dev

      - name: FreeRDP (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install freerdp:x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      # --- QtKeychain, built against the installed Qt ---
      - name: QtKeychain
        shell: bash
        run: |
          git clone --depth 1 --branch "$QTKEYCHAIN_REF" https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/deps"
          cmake --build "$RUNNER_TEMP/qtkeychain/build"
          cmake --install "$RUNNER_TEMP/qtkeychain/build"

      - name: Configure
        shell: bash
        run: |
          EXTRA=()
          [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ] && EXTRA+=("-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE")
          [ "$RUNNER_OS" = macOS ] && EXTRA+=("-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/deps;/opt/homebrew") \
                                   || EXTRA+=("-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/deps")
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"

      - name: Build
        run: cmake --build build

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          macdeployqt build/Perch.app -qmldir=qml
          # Re-sign ad-hoc after macdeployqt's dylib-path rewrites, or the app
          # SIGKILLs on launch ("Code Signature Invalid") on other Macs.
          codesign --remove-signature build/Perch.app 2>/dev/null || true
          codesign --force --deep --sign - build/Perch.app
          codesign --verify --deep --strict build/Perch.app
          hdiutil create -volname Perch -srcfolder build/Perch.app -ov -format UDZO Perch-macos.dmg

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist && cp build/Perch.exe dist/
          # Place non-Qt DLLs next to the exe first so windeployqt can resolve
          # them (qt6keychain.dll lives in RUNNER_TEMP, not Qt's bin dir).
          cp "$RUNNER_TEMP"/deps/bin/*.dll dist/ 2>/dev/null || true
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll dist/ 2>/dev/null || true
          # windeployqt resolves qt6keychain.dll (a qt6* name) from Qt's bin, not
          # from the exe dir, so place it beside windeployqt before running it.
          cp "$RUNNER_TEMP"/deps/bin/*.dll "$(dirname "$(command -v windeployqt)")/" 2>/dev/null || true
          windeployqt --qmldir qml --release dist/Perch.exe

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: perch-${{ matrix.name }}
          path: |
            Perch-macos.dmg
            dist/
            build/Perch
          if-no-files-found: ignore
