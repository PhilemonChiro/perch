name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QT_VERSION: "6.9.3"
  QTKEYCHAIN_REF: "0.15.0"
  FREERDP_VERSION: "3.32.2"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
          - os: macos-15
            name: macos
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      - name: FreeRDP (macOS)
        if: runner.os == 'macOS'
        # The runner image ships BOTH a pinned local homebrew/core tap and a
        # stale Homebrew API cache (formula.jws.json) that resolve FreeRDP to
        # 3.31.x. With auto-update off, brew reads the stale cache and never
        # sees 3.32.2. Untap and clear the API cache so the install fetches the
        # current formula (3.32.2, >= the SECURITY.md floor) and its
        # arm64_sequoia bottle (present on macos-15). No slow `brew update`.
        run: |
          brew untap --force homebrew/core homebrew/cask 2>/dev/null || true
          rm -rf "$(brew --cache)/api" ~/Library/Caches/Homebrew/api 2>/dev/null || true
          brew install freerdp freetds libpq ninja
          brew list --versions freerdp

      # Cache the from-source FreeRDP install so it is rebuilt only when the
      # version changes (saves ~4 min/run).
      - name: Cache FreeRDP (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deps
          key: freerdp-${{ matrix.os }}-${{ env.FREERDP_VERSION }}-v1

      - name: FreeRDP (Linux)
        if: runner.os == 'Linux'
        # Ubuntu ships FreeRDP ~3.5, below Perch's >= 3.32 security floor, so
        # build 3.32.x from source into the shared deps prefix.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libssl-dev zlib1g-dev libsecret-1-dev libgl1-mesa-dev \
            libx11-dev libxext-dev libxcursor-dev libxkbcommon-dev libxkbfile-dev \
            libxrandr-dev libxi-dev libxfixes-dev libxdamage-dev libxrender-dev \
            libxinerama-dev libfuse2 \
            libkrb5-dev libcjson-dev liburiparser-dev \
            freetds-dev libpq-dev
          if ls "$RUNNER_TEMP"/deps/lib*/libfreerdp3.so* >/dev/null 2>&1; then
            echo "FreeRDP $FREERDP_VERSION restored from cache; skipping build"
          else
            git clone --depth 1 --branch "$FREERDP_VERSION" https://github.com/FreeRDP/FreeRDP.git "$RUNNER_TEMP/freerdp"
            cmake -S "$RUNNER_TEMP/freerdp" -B "$RUNNER_TEMP/freerdp/build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/deps" \
              -DWITH_SERVER=OFF -DWITH_SAMPLE=OFF -DBUILD_TESTING=OFF -DWITH_MANPAGES=OFF \
              -DWITH_SWSCALE=OFF -DWITH_FFMPEG=OFF -DWITH_X11=OFF -DWITH_WAYLAND=OFF \
              -DWITH_CUPS=OFF -DWITH_PULSE=OFF -DWITH_ALSA=OFF -DWITH_PCSC=OFF -DWITH_CLIENT_SDL=OFF -DWITH_FUSE=OFF -DCHANNEL_URBDRC=OFF
            cmake --build "$RUNNER_TEMP/freerdp/build"
            cmake --install "$RUNNER_TEMP/freerdp/build"
          fi

      # Cache vcpkg's built packages so FreeRDP is not recompiled each run
      # (saves the bulk of the ~9 min Windows build). The >= 3.32 compile floor
      # fails the build if a stale cache ever pins an older FreeRDP.
      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-${{ matrix.os }}-freerdp-freetds-libpq-v2

      - name: FreeRDP (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install freerdp:x64-windows freetds:x64-windows libpq:x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: QtKeychain
        shell: bash
        run: |
          git clone --depth 1 --branch "$QTKEYCHAIN_REF" https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/deps"
          cmake --build "$RUNNER_TEMP/qtkeychain/build"
          cmake --install "$RUNNER_TEMP/qtkeychain/build"

      - name: Configure
        shell: bash
        run: |
          EXTRA=()
          [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ] && EXTRA+=("-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE")
          [ "$RUNNER_OS" = macOS ] && EXTRA+=("-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/deps;/opt/homebrew") \
                                   || EXTRA+=("-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/deps")
          # Compile the real release version (from the v* tag) into the binary so
          # the in-app update check reports the version actually running.
          [ -n "${GITHUB_REF_NAME:-}" ] && EXTRA+=("-DPERCH_VERSION=${GITHUB_REF_NAME#v}")
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"

      - name: Build
        run: cmake --build build

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          # macdeployqt rewrites dylib load paths in the Mach-O binaries after
          # the linker's ad-hoc signature, invalidating it (SIGKILL "Code
          # Signature Invalid" on launch). Run it first, then (re)sign the
          # finished bundle so every page hash matches the shipped content.
          macdeployqt build/Perch.app -qmldir=qml
          bash .github/scripts/bundle-openssl-legacy.sh build/Perch.app

          if [ -n "${MACOS_SIGN_IDENTITY:-}" ] && [ -n "${MACOS_CERT_P12:-}" ]; then
            echo "Signing with Developer ID + notarizing."
            # Import the Developer ID Application cert into a throwaway keychain.
            KCPASS=$(uuidgen)
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KCPASS" build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security unlock-keychain -p "$KCPASS" build.keychain
            security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
              -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KCPASS" build.keychain
            security list-keychains -d user -s build.keychain login.keychain-db
            rm -f "$RUNNER_TEMP/cert.p12"

            # Hardened runtime (--options runtime) and a secure --timestamp are
            # both required for notarization to pass.
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" build/Perch.app
            codesign --verify --deep --strict build/Perch.app

            hdiutil create -volname Perch -srcfolder build/Perch.app -ov -format UDZO Perch-macOS.dmg

            xcrun notarytool submit Perch-macOS.dmg \
              --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" \
              --password "$MACOS_NOTARY_PASSWORD" --wait
            # Staple the ticket so the app validates offline / on first launch.
            xcrun stapler staple Perch-macOS.dmg
          else
            echo "No Developer ID secrets; ad-hoc signing (Gatekeeper will warn)."
            codesign --remove-signature build/Perch.app 2>/dev/null || true
            codesign --force --deep --sign - build/Perch.app
            codesign --verify --deep --strict build/Perch.app
            hdiutil create -volname Perch -srcfolder build/Perch.app -ov -format UDZO Perch-macOS.dmg
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist && cp build/Perch.exe dist/
          cp "$RUNNER_TEMP"/deps/bin/*.dll dist/ 2>/dev/null || true
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll dist/ 2>/dev/null || true
          # windeployqt resolves qt6keychain.dll (a qt6* name) from Qt's bin, not
          # from the exe dir, so place it beside windeployqt before running it.
          cp "$RUNNER_TEMP"/deps/bin/*.dll "$(dirname "$(command -v windeployqt)")/" 2>/dev/null || true
          # --compiler-runtime bundles the MSVC runtime (MSVCP140.dll,
          # VCRUNTIME140*.dll) app-local so machines without the VC++
          # Redistributable installed can still launch Perch.
          windeployqt --qmldir qml --release --compiler-runtime dist/Perch.exe
          # windeployqt --compiler-runtime only drops vc_redist.x64.exe (the
          # installer), not the loose DLLs, so copy the whole MSVC runtime DLL set
          # ourselves. The SQL client DLLs (freetds/libpq) pull in extra CRT parts
          # such as MSVCP140_2.dll, so copy every MSVCP140*/VCRUNTIME140*/CONCRT140*
          # file, not a fixed list. Source: the toolchain redist CRT folder when
          # present, plus the installed copies in System32 (present because VS is
          # installed); cp -n keeps whichever landed first.
          copy_glob() {
            local dir="$1" pat f
            for pat in 'MSVCP140*.dll' 'VCRUNTIME140*.dll' 'CONCRT140*.dll'; do
              for f in "$dir"/$pat; do [ -f "$f" ] && cp -n "$f" dist/; done
            done
            return 0  # never let an unmatched glob abort the step under `set -e`
          }
          # Try loose DLLs first: the toolchain redist CRT folder, then System32.
          if [ -n "${VCToolsRedistDir:-}" ]; then
            redist="$(cygpath -u "$VCToolsRedistDir" 2>/dev/null || echo "$VCToolsRedistDir")"
            crt="$(find "$redist" -ipath '*x64*' -iname 'Microsoft.VC*.CRT' -type d 2>/dev/null | head -1)"
            [ -n "$crt" ] && copy_glob "$crt"
          fi
          copy_glob /c/Windows/System32
          # The runner images ship the CRT only as the vc_redist installer bundle
          # (no loose DLLs in System32 or the redist tree), so install it — the
          # runner is admin — to populate System32, then copy the DLLs app-local.
          if [ ! -f dist/MSVCP140.dll ] && [ -f dist/vc_redist.x64.exe ]; then
            MSYS_NO_PATHCONV=1 powershell -NoProfile -Command \
              "Start-Process -FilePath 'dist\\vc_redist.x64.exe' -ArgumentList '/install','/quiet','/norestart' -Wait" || true
            copy_glob /c/Windows/System32
          fi
          # vc_redist.x64.exe is the installer, not a dependency; drop it from the app dir.
          rm -f dist/vc_redist.x64.exe
          # Fail loudly if any required runtime DLL is still missing.
          for d in MSVCP140.dll MSVCP140_2.dll VCRUNTIME140.dll VCRUNTIME140_1.dll; do
            [ -f "dist/$d" ] || { echo "ERROR: $d missing from dist/"; ls -la dist/; exit 1; }
          done
          # NLA needs OpenSSL's legacy provider (MD4/RC4); ship and activate it.
          bash .github/scripts/bundle-openssl-legacy-win.sh dist
          cp windows/perch.ico dist/ 2>/dev/null || true
          # One-click installer via Inno Setup (preinstalled on the runner).
          VERSION="${GITHUB_REF_NAME#v}"
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          "$ISCC" "//DAppVersion=$VERSION" "//DSourceDir=$(cygpath -w "$PWD/dist")" "//O$(cygpath -w "$PWD")" .github/installer/perch.iss
          ls -l Perch-Setup-x64.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Install into an AppDir (install rule puts the binary in usr/bin).
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          install -Dm644 linux/com.philemonchiro.Perch.desktop \
            AppDir/usr/share/applications/com.philemonchiro.Perch.desktop
          install -Dm644 linux/perch.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/com.philemonchiro.Perch.png
          # NLA needs OpenSSL's legacy provider (MD4/RC4). Bundle it and activate
          # it from an AppRun hook, since the system provider is not deployed.
          MOD=$(openssl version -m 2>/dev/null | sed -E 's/.*"(.*)".*/\1/')
          : "${MOD:=/usr/lib/x86_64-linux-gnu/ossl-modules}"
          install -Dm644 "$MOD/legacy.so" AppDir/usr/lib/ossl-modules/legacy.so
          printf '%s\n' 'openssl_conf = openssl_init' '[openssl_init]' \
            'providers = provider_sect' '[provider_sect]' 'default = default_sect' \
            'legacy = legacy_sect' '[default_sect]' 'activate = 1' \
            '[legacy_sect]' 'activate = 1' > AppDir/usr/lib/ossl-modules/openssl.cnf
          mkdir -p AppDir/apprun-hooks
          printf '%s\n' \
            'if [ -d "$APPDIR/usr/lib/ossl-modules" ]; then' \
            '  export OPENSSL_MODULES="$APPDIR/usr/lib/ossl-modules"' \
            '  export OPENSSL_CONF="$APPDIR/usr/lib/ossl-modules/openssl.cnf"' \
            'fi' > AppDir/apprun-hooks/10-openssl-legacy.sh
          # linuxdeploy + Qt plugin bundle Qt, QML, FreeRDP and QtKeychain.
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export LD_LIBRARY_PATH="$RUNNER_TEMP/deps/lib:${LD_LIBRARY_PATH:-}"
          export QML_SOURCES_PATHS="$PWD/qml"
          export OUTPUT="Perch-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/com.philemonchiro.Perch.png \
            -d AppDir/usr/share/applications/com.philemonchiro.Perch.desktop
          ls -l Perch-x86_64.AppImage

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Perch-macOS.dmg
            Perch-Setup-x64.exe
            Perch-x86_64.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: false
