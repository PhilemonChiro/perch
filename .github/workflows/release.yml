name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QT_VERSION: "6.9.3"
  QTKEYCHAIN_REF: "0.15.0"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            name: windows
          - os: macos-15
            name: macos
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v7

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      - name: FreeRDP (macOS)
        if: runner.os == 'macOS'
        # The runner image ships BOTH a pinned local homebrew/core tap and a
        # stale Homebrew API cache (formula.jws.json) that resolve FreeRDP to
        # 3.31.x. With auto-update off, brew reads the stale cache and never
        # sees 3.32.2. Untap and clear the API cache so the install fetches the
        # current formula (3.32.2, >= the SECURITY.md floor) and its
        # arm64_sequoia bottle (present on macos-15). No slow `brew update`.
        run: |
          brew untap --force homebrew/core homebrew/cask 2>/dev/null || true
          rm -rf "$(brew --cache)/api" ~/Library/Caches/Homebrew/api 2>/dev/null || true
          brew install freerdp ninja
          brew list --versions freerdp

      - name: FreeRDP (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build freerdp3-dev libsecret-1-dev libgl1-mesa-dev libxkbcommon-dev

      - name: FreeRDP (Windows, vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install freerdp:x64-windows
          "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: QtKeychain
        shell: bash
        run: |
          git clone --depth 1 --branch "$QTKEYCHAIN_REF" https://github.com/frankosterfeld/qtkeychain.git "$RUNNER_TEMP/qtkeychain"
          cmake -S "$RUNNER_TEMP/qtkeychain" -B "$RUNNER_TEMP/qtkeychain/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_WITH_QT6=ON -DBUILD_TRANSLATIONS=OFF -DBUILD_TEST_APPLICATION=OFF \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/deps"
          cmake --build "$RUNNER_TEMP/qtkeychain/build"
          cmake --install "$RUNNER_TEMP/qtkeychain/build"

      - name: Configure
        shell: bash
        run: |
          EXTRA=()
          [ -n "${CMAKE_TOOLCHAIN_FILE:-}" ] && EXTRA+=("-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE")
          [ "$RUNNER_OS" = macOS ] && EXTRA+=("-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/deps;/opt/homebrew") \
                                   || EXTRA+=("-DCMAKE_PREFIX_PATH=$RUNNER_TEMP/deps")
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${EXTRA[@]}"

      - name: Build
        run: cmake --build build

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          # macdeployqt rewrites dylib load paths in the Mach-O binaries after
          # the linker's ad-hoc signature, invalidating it (SIGKILL "Code
          # Signature Invalid" on launch). Run it first, then (re)sign the
          # finished bundle so every page hash matches the shipped content.
          macdeployqt build/Perch.app -qmldir=qml
          bash .github/scripts/bundle-openssl-legacy.sh build/Perch.app

          if [ -n "${MACOS_SIGN_IDENTITY:-}" ] && [ -n "${MACOS_CERT_P12:-}" ]; then
            echo "Signing with Developer ID + notarizing."
            # Import the Developer ID Application cert into a throwaway keychain.
            KCPASS=$(uuidgen)
            echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KCPASS" build.keychain
            security set-keychain-settings -lut 21600 build.keychain
            security unlock-keychain -p "$KCPASS" build.keychain
            security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
              -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k "$KCPASS" build.keychain
            security list-keychains -d user -s build.keychain login.keychain-db
            rm -f "$RUNNER_TEMP/cert.p12"

            # Hardened runtime (--options runtime) and a secure --timestamp are
            # both required for notarization to pass.
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGN_IDENTITY" build/Perch.app
            codesign --verify --deep --strict build/Perch.app

            hdiutil create -volname Perch -srcfolder build/Perch.app -ov -format UDZO Perch-macOS.dmg

            xcrun notarytool submit Perch-macOS.dmg \
              --apple-id "$MACOS_NOTARY_APPLE_ID" \
              --team-id "$MACOS_NOTARY_TEAM_ID" \
              --password "$MACOS_NOTARY_PASSWORD" --wait
            # Staple the ticket so the app validates offline / on first launch.
            xcrun stapler staple Perch-macOS.dmg
          else
            echo "No Developer ID secrets; ad-hoc signing (Gatekeeper will warn)."
            codesign --remove-signature build/Perch.app 2>/dev/null || true
            codesign --force --deep --sign - build/Perch.app
            codesign --verify --deep --strict build/Perch.app
            hdiutil create -volname Perch -srcfolder build/Perch.app -ov -format UDZO Perch-macOS.dmg
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist && cp build/Perch.exe dist/
          cp "$RUNNER_TEMP"/deps/bin/*.dll dist/ 2>/dev/null || true
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/*.dll dist/ 2>/dev/null || true
          # windeployqt resolves qt6keychain.dll (a qt6* name) from Qt's bin, not
          # from the exe dir, so place it beside windeployqt before running it.
          cp "$RUNNER_TEMP"/deps/bin/*.dll "$(dirname "$(command -v windeployqt)")/" 2>/dev/null || true
          windeployqt --qmldir qml --release dist/Perch.exe
          cd dist && 7z a ../Perch-Windows-x64.zip . >/dev/null

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p Perch-linux && cp build/Perch Perch-linux/
          cp README.md LICENSE NOTICE Perch-linux/ 2>/dev/null || true
          tar czf Perch-Linux-x64.tar.gz -C Perch-linux .

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Perch-macOS.dmg
            Perch-Windows-x64.zip
            Perch-Linux-x64.tar.gz
          generate_release_notes: true
          fail_on_unmatched_files: false
