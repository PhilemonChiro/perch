version: 2
updates:
  # Keep the GitHub Actions used by the build/release workflows patched.
  # Dependabot cannot track the native libraries (FreeRDP, OpenSSL, Qt) that
  # come from brew/apt/vcpkg; those are held to a minimum by the compile-time
  # FreeRDP floor in src/RdpSession.cpp and documented in SECURITY.md.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
